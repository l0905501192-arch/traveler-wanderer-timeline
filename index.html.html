<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>旅者與浪人之章｜主線進度</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #393a3d;
      --muted: #85858a;
      --line: #d8d5ce;
      --paper: #fbfaf7;
      --accent: #8b9b8b;
      --accent-deep: #5e7463;
      --accent-soft: #e8eee7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 18px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                   "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 22px 18px;
      border: 1px solid #e8e5de;
      border-radius: 18px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 8px 26px rgba(55, 55, 45, .035);
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(19px, 3vw, 25px);
      font-weight: 650;
      letter-spacing: .04em;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .timeline-viewport {
      margin: 30px -4px 8px;
      overflow-x: auto;
      padding: 10px 4px 16px;
      scrollbar-color: #d6d9d1 transparent;
      scrollbar-width: thin;
    }
    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(11, minmax(66px, 1fr));
      min-width: 760px;
      align-items: start;
      padding-top: 2px;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 4.55%;
      right: 4.55%;
      top: 17px;
      height: 2px;
      border-radius: 2px;
      background: var(--line);
    }
    .node {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      color: var(--ink);
      text-decoration: none;
      outline-offset: 5px;
    }
    .dot {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border: 2px solid #c7cec4;
      border-radius: 50%;
      background: #fff;
      color: var(--accent-deep);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .dot svg { width: 12px; height: 12px; }
    .percent {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .node:hover .dot,
    .node:focus-visible .dot {
      transform: translateY(-2px) scale(1.08);
      border-color: var(--accent-deep);
      background: var(--accent-soft);
    }
    .node:focus-visible { outline: 2px solid var(--accent-deep); border-radius: 8px; }
    .node:first-child .dot,
    .node:last-child .dot {
      border-color: var(--accent-deep);
      background: var(--accent-deep);
      color: white;
    }
    .hint {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    @media (max-width: 600px) {
      body { padding: 12px 10px; }
      .wrap { padding: 19px 14px 15px; border-radius: 14px; }
      .timeline-viewport { margin-top: 24px; }
      .subtitle { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">TRAVELER &amp; WANDERER</p>
    <h1>旅者與浪人之章</h1>

          <span class="dot"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2 6.3 11.2 13 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="percent">0%</span>

        </a>
        <a class="node" href="https://app.notion.com/p/dd7e5b39ff274ce79356bd73d51f874f#3f5a669961ad8040ba05dcd20c85a353" target="_blank" rel="noopener noreferrer" aria-label="前往主線進度 100%">
          <span class="dot"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.2 6.3 11.2 13 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="percent">100%</span>

      </div>
    </nav>
    <p class="hint">點選百分比即可前往對應圖庫・手機可左右滑動</p>
